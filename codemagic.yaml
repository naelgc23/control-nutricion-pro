workflows:
  ios-workflow:
    name: iOS App Build
    instance_type: mac_mini_m2
    environment:
      ruby: 3.2.2
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.nutricionpro.app"
    scripts:
      - name: Install Node dependencies
        script: |
          npm ci
      - name: Fix permissions
        script: |
          chmod +x node_modules/.bin/*
      - name: Build React app
        script: |
          npm run build
      - name: Prepare Ruby and CocoaPods
        script: |
          ruby -v
          gem install bundler -v 2.5.22 --no-document
          gem install cocoapods -v 1.15.2 --no-document
          pod --version
      - name: Update Capacitor iOS
        script: |
          npx cap sync ios
      - name: Install iOS dependencies
        script: |
          cd ios/App && pod install --repo-update && cd ../..
      - name: Build iOS app
        script: |
          xcodebuild build -workspace ios/App/App.xcworkspace \
          -scheme App \
          -configuration Release \
          -derivedDataPath build/ios \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
      - name: Create IPA
        script: |
          mkdir -p build/Payload
          cp -r build/ios/Build/Products/Release-iphoneos/App.app build/Payload/
          cd build
          zip -r -q App.ipa Payload/
          cd ..
    artifacts:
      - build/App.ipa
